# Tests the Julia package in julia/
on:
  push:
    branches: [main, master]
    paths:
      - 'julia/**'
      - '.github/workflows/julia.yaml'
  pull_request:
    paths:
      - 'julia/**'
      - '.github/workflows/julia.yaml'

name: Julia

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (Julia ${{ matrix.version }})

    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest]
        include:
          - {version: '1', os: macos-latest}
          - {version: '1', os: windows-latest}

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - uses: julia-actions/cache@v2

      - name: Run tests
        shell: bash
        run: julia --color=yes --project=julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
